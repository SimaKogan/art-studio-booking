spring:
  application:
    name: art-studio-booking
  datasource:
    # In-memory H2 by default; docker-compose switches to PostgreSQL through env vars.
    url: ${DB_URL:jdbc:h2:mem:artstudio;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # HS256 needs at least 32 bytes. ALWAYS override in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    ttl-minutes: 720
  booking:
    hold-minutes: 15
    free-cancellation-hours: 24
  ai:
    provider: ${AI_PROVIDER:local}        # local | vertex
    vertex:
      project-id: ${VERTEX_PROJECT_ID:}
      location: ${VERTEX_LOCATION:us-central1}
      model: ${VERTEX_MODEL:gemini-2.5-flash}
